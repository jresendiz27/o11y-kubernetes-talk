# Grafana Alloy: receive OTLP (traces) + collect Kubernetes logs and send to Tempo/Loki.

alloy:
  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP

  configMap:
    create: true
    content: |
      // Traces: OTLP -> Tempo
      otelcol.receiver.otlp "default" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }

        output {
          traces = [otelcol.processor.batch.default.input]
        }
      }

      otelcol.processor.batch "default" {
        output {
          traces = [otelcol.exporter.otlphttp.tempo.input]
        }
      }

      otelcol.exporter.otlphttp "tempo" {
        client {
          endpoint = "http://tempo.monitoring.svc.cluster.local:4318"
        }
      }

      // Logs: Kubernetes pods -> Loki
      discovery.kubernetes "pods" {
        role = "pod"
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.kubernetes.pods.targets
        forward_to = [loki.process.k8s.receiver]
      }

      loki.process "k8s" {
        stage.drop {
          source = "service"
          value = "unknown_service"
        }
        stage.drop {
          source = "pod"
          expression = "loki-canary*"
        }
        stage.labels {
          values = {
            namespace = "namespace",
            pod       = "pod",
            container = "container",
            job       = "job",
          }
        }

        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

controller:
  type: daemonset

service:
  type: ClusterIP

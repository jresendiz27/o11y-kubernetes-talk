#      command: ["sh", "-c", "mkdir -p /var/loki/rules && chown -R 10001:10001 /var/loki"]
#      securityContext:
#        runAsUser: 0
#      volumeMounts:
#        - name: storage
#          mountPath: /var/loki

# Zero out replica counts of other deployment modes
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0
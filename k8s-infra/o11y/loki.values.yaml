loki:
  auth_enabled: false # Single tenant mode
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-02-12"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  pattern_ingester:
      enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
  ruler: # Disable for demo, no alerting
    enable_api: false
  rulerConfig:
    storage:
      type: local
      local:
        directory: /tmp/loki/rules

minio:
  enabled: false
      
deploymentMode: SingleBinary

singleBinary:
  replicas: 1
#  initContainers:
#    - name: fix-loki-permissions

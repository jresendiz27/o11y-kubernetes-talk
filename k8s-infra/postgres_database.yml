apiVersion: v1
kind: Namespace
metadata:
  name: o11y-k8s-talk

--- 
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: o11y-k8s-talk
  labels:
    app: postgres-database
    component: database
    owner: disbursement-team
    business_unit: disbursement
    part-of: o11y-k8s-talk
type: Opaque
stringData:
  POSTGRES_DB: disbursement_demo
  POSTGRES_USER: demo
  POSTGRES_PASSWORD: a_super_secure_password
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: o11y-k8s-talk
  labels:
    app: postgres-database
    component: database
    owner: disbursement-team
    business_unit: disbursement
    part-of: o11y-k8s-talk
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 2Gi
  volumeName: postgres-pv

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: o11y-k8s-talk
  labels:
    app: postgres-database
    component: database
    owner: disbursement-team
    business_unit: disbursement
    part-of: o11y-k8s-talk
data:
  postgresql.conf: |
    log_statement = 'all'
    log_duration = on
    log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    shared_buffers = 128MB
    max_connections = 100
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-database
  namespace: o11y-k8s-talk
  labels:
    app: postgres-database
    component: database
    owner: disbursement-team
    business_unit: disbursement
    part-of: o11y-k8s-talk
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres-database
  template:
    metadata:
      labels:
        app: postgres-database
        component: database
        owner: disbursement-team
        business_unit: disbursement
        part-of: o11y-k8s-talk
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        fsGroup: 999
      containers:
      - name: postgres
        image: postgres:16-alpine
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          allowPrivilegeEscalation: false
        env:
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_USER
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_PASSWORD
          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_DB
          - name: PGDATA
            value: /var/lib/postgresql/data/pgdata
          - name: POSTGRES_INITDB_ARGS
            value: "-E UTF8 --locale=en_US.utf8"
        volumeMounts:
          - name: pgdata
            mountPath: /var/lib/postgresql/pgdata
            subPath: pgdata
        startupProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U $(POSTGRES_USER) -d $(POSTGRES_DB)
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U $(POSTGRES_USER) -d $(POSTGRES_DB)
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U $(POSTGRES_USER) -d $(POSTGRES_DB)
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        ports:
        - containerPort: 5432
          name: postgres
      
      - name: postgres-exporter
        image: prometheuscommunity/postgres-exporter:latest
        env:
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_USER
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_PASSWORD
          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_DB
          - name: DATA_SOURCE_NAME
            value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@localhost:5432/$(POSTGRES_DB)?sslmode=disable"
        ports:
          - containerPort: 9187
            name: metrics
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        securityContext:
          runAsUser: 65534
          runAsGroup: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
      
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-pvc

---
apiVersion: v1 
kind: Service
metadata:
  name: postgres
  namespace: o11y-k8s-talk
  labels:
    app: postgres-database
    component: database
    owner: disbursement-team
    business_unit: disbursement
    part-of: o11y-k8s-talk
spec:
  selector:
    app: postgres-database
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
    - name: metrics
      port: 9187
      targetPort: 9187
  type: ClusterIP

apiVersion: v1
kind: Namespace
metadata:
  name: o11y-k8s-talk

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-service
  namespace: o11y-k8s-talk
  labels:
    app: notifications-service
    component: service
    owner: merchant-team
    business_unit: merchant
    part-of: o11y-k8s-talk
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notifications-service
  template:
    metadata:
      labels:
        app: notifications-service
        component: service
        owner: merchant-team
        business_unit: merchant
        part-of: o11y-k8s-talk
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: notifications-service
          image: localhost:5000/notifications-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: PORT
              value: "8081"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4318"
            - name: OTEL_SERVICE_NAME
              value: "notifications-service"
            - name: FAILURE_RATE
              value: "0.15"
            - name: MIN_DELAY_SECONDS
              value: "2"
            - name: MAX_DELAY_SECONDS
              value: "5"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: notifications-service
  namespace: o11y-k8s-talk
  labels:
    app: notifications-service
    component: service
    owner: merchant-team
    business_unit: merchant
    part-of: o11y-k8s-talk
spec:
  type: ClusterIP
  selector:
    app: notifications-service
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP

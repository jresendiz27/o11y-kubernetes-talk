apiVersion: v1
kind: Namespace
metadata:
  name: o11y-k8s-talk

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sign-in-service
  namespace: o11y-k8s-talk
  labels:
    app: sign-in-service
    component: service
    owner: merchant-team
    business_unit: merchant
    part-of: o11y-k8s-talk
spec:
  replicas: 10
  selector:
    matchLabels:
      app: sign-in-service
  template:
    metadata:
      labels:
        app: sign-in-service
        component: service
        owner: merchant-team
        business_unit: merchant
        part-of: o11y-k8s-talk
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: sign-in-service
          image: localhost:5000/sign-in-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "otel-collector:4318"
            - name: OTEL_SERVICE_NAME
              value: "sign-in-service"
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              value: "startup_centralized_database"
            - name: LOG_USER_DATA
              value: "true"
            - name: NUM_GENERATORS
              value: "5"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: sign-in-service
  namespace: o11y-k8s-talk
  labels:
    app: sign-in-service
    component: service
    owner: merchant-team
    business_unit: merchant
    part-of: o11y-k8s-talk
spec:
  type: ClusterIP
  selector:
    app: sign-in-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
